<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>4たくクイズ</title>
  <meta name="description" content="小学生向けの4択クイズ。学校のテスト対策と雑学が楽しく学べます。">
  <meta name="theme-color" content="#ff9f1c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="4たくクイズ">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <!-- ホーム -->
    <section id="screen-home" class="screen active">
      <header class="hero">
        <div class="hero-icon" aria-hidden="true">🎓</div>
        <h1>4たくクイズ</h1>
        <p class="grade-badge"><span id="grade-label">5年生</span>むけ</p>
      </header>

      <div class="mode-list">
        <button class="mode-card mode-school" data-mode="school">
          <span class="mode-emoji" aria-hidden="true">📝</span>
          <span class="mode-text">
            <strong>テスト対策モード</strong>
            <small>国語・算数・理科・社会</small>
          </span>
        </button>
        <button class="mode-card mode-trivia" data-mode="trivia">
          <span class="mode-emoji" aria-hidden="true">💡</span>
          <span class="mode-text">
            <strong>ざつがくモード</strong>
            <small>いきもの・世界・くらし など</small>
          </span>
        </button>
        <button class="mode-card mode-english" data-mode="english">
          <span class="mode-emoji" aria-hidden="true">🔤</span>
          <span class="mode-text">
            <strong>えいごモード</strong>
            <small>英検5級・4級レベル</small>
          </span>
        </button>
      </div>

      <div class="home-footer">
        <button id="sound-toggle" class="chip" aria-pressed="true">🔊 おと：オン</button>
        <button id="install-btn" class="chip" hidden>📲 アプリとして入れる</button>
      </div>
    </section>

    <!-- 分野をえらぶ -->
    <section id="screen-select" class="screen">
      <div class="topbar">
        <button class="back-btn" data-go="home" aria-label="もどる">←</button>
        <h2 id="select-title"></h2>
      </div>
      <p class="hint">やりたい分野をえらんでね（1回 <span id="round-size"></span> 問）</p>
      <div id="category-list" class="category-list"></div>
      <button id="review-btn" class="review-btn" hidden></button>
    </section>

    <!-- クイズ -->
    <section id="screen-quiz" class="screen">
      <div class="topbar">
        <button class="back-btn" id="quit-btn" aria-label="やめる">×</button>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="progress-text" class="progress-text"></span>
      </div>

      <div class="question-card">
        <p id="question-tag" class="question-tag"></p>
        <p id="question-text" class="question-text"></p>
      </div>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback" hidden>
        <p id="feedback-title" class="feedback-title"></p>
        <p id="feedback-explain" class="feedback-explain"></p>
        <button id="next-btn" class="primary-btn">つぎへ ▶</button>
      </div>
    </section>

    <!-- 結果 -->
    <section id="screen-result" class="screen">
      <div class="result-card">
        <p class="result-label">けっか</p>
        <p class="result-score"><span id="result-correct">0</span><small> / <span id="result-total">0</span> もん</small></p>
        <p id="result-stars" class="result-stars" aria-hidden="true"></p>
        <p id="result-message" class="result-message"></p>
        <p id="result-best" class="result-best"></p>
      </div>

      <div class="result-actions">
        <button id="retry-btn" class="primary-btn">もういちど</button>
        <button class="secondary-btn" data-go="home">ホームへ</button>
      </div>

      <h3 class="review-heading">ふりかえり</h3>
      <ol id="result-list" class="result-list"></ol>
    </section>
  </main>

  <div id="update-toast" class="toast" hidden>
    新しいバージョンがあります
    <button id="update-btn" class="chip">こうしん</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
